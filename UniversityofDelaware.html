
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Delaware_adjacency</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFFFFF;
}

graph {
    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<div id="graph"></div>


<!-- 3D force graph -->
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph"></script>

<script type="module">

import ForceGraph3D
    from "https://cdn.jsdelivr.net/npm/3d-force-graph/+esm";

const graphData = {"nodes": [{"id": "Seyfferth, Angelia L", "name": "Seyfferth, Angelia L", "degree": 3, "strength": 13.0}, {"id": "Vargas, Rodrigo", "name": "Vargas, Rodrigo", "degree": 2, "strength": 12.0}, {"id": "Bais, Harsh P", "name": "Bais, Harsh P", "degree": 5, "strength": 17.0}, {"id": "Kniel, Kalmia E", "name": "Kniel, Kalmia E", "degree": 3, "strength": 9.0}, {"id": "Rosier, Amanda", "name": "Rosier, Amanda", "degree": 1, "strength": 5.0}, {"id": "Donofrio, Nicole M", "name": "Donofrio, Nicole M", "degree": 4, "strength": 5.0}, {"id": "Jin, Yan", "name": "Jin, Yan", "degree": 3, "strength": 5.0}, {"id": "Caplan, Jeffrey Lewis", "name": "Caplan, Jeffrey Lewis", "degree": 4, "strength": 16.0}, {"id": "Lee, JungYoun", "name": "Lee, JungYoun", "degree": 1, "strength": 1.0}, {"id": "Meyers, Blake C", "name": "Meyers, Blake C", "degree": 3, "strength": 13.0}, {"id": "Green, Pamela J", "name": "Green, Pamela J", "degree": 2, "strength": 2.0}, {"id": "Wisser, Randall J", "name": "Wisser, Randall J", "degree": 2, "strength": 5.0}, {"id": "Chen, Haiqiang", "name": "Chen, Haiqiang", "degree": 1, "strength": 1.0}], "links": [{"source": "Seyfferth, Angelia L", "target": "Vargas, Rodrigo", "weight": 11.0}, {"source": "Seyfferth, Angelia L", "target": "Bais, Harsh P", "weight": 1.0}, {"source": "Seyfferth, Angelia L", "target": "Donofrio, Nicole M", "weight": 1.0}, {"source": "Vargas, Rodrigo", "target": "Jin, Yan", "weight": 1.0}, {"source": "Bais, Harsh P", "target": "Kniel, Kalmia E", "weight": 7.0}, {"source": "Bais, Harsh P", "target": "Rosier, Amanda", "weight": 5.0}, {"source": "Bais, Harsh P", "target": "Donofrio, Nicole M", "weight": 1.0}, {"source": "Bais, Harsh P", "target": "Jin, Yan", "weight": 3.0}, {"source": "Kniel, Kalmia E", "target": "Jin, Yan", "weight": 1.0}, {"source": "Kniel, Kalmia E", "target": "Chen, Haiqiang", "weight": 1.0}, {"source": "Donofrio, Nicole M", "target": "Meyers, Blake C", "weight": 2.0}, {"source": "Donofrio, Nicole M", "target": "Wisser, Randall J", "weight": 1.0}, {"source": "Caplan, Jeffrey Lewis", "target": "Lee, JungYoun", "weight": 1.0}, {"source": "Caplan, Jeffrey Lewis", "target": "Meyers, Blake C", "weight": 10.0}, {"source": "Caplan, Jeffrey Lewis", "target": "Green, Pamela J", "weight": 1.0}, {"source": "Caplan, Jeffrey Lewis", "target": "Wisser, Randall J", "weight": 4.0}, {"source": "Meyers, Blake C", "target": "Green, Pamela J", "weight": 1.0}]};

console.log("First edge:", graphData.links[0]);
console.log("Nodes:", graphData.nodes.length);
console.log("Edges:", graphData.links.length);

const Graph = ForceGraph3D()(
    document.getElementById("graph")
);

Graph
    .nodeId("id")
    .linkSource("source")
    .linkTarget("target")
    .graphData(graphData)
    .backgroundColor("#FFFFFF")
    .showNavInfo(false)

    // Node appearance
    .nodeColor(() => "#073763")
    .nodeVal(node =>
        1.5 + Math.sqrt(node.strength + 1) * 0.45
    )

    // Edge appearance
    .linkColor(() => "#648FC9")
    .linkOpacity(0.7)
    .linkWidth(link =>
        0.5 + Math.sqrt(Number(link.weight) || 1) * 0.35
    );

</script>

</body>
</html>
