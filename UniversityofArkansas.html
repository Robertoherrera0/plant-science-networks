    )

    // Edge appearance
    .linkColor(() => "#648FC9")
    .linkOpacity(0.7)
    .linkWidth(link =>
        0.5 + Math.sqrt(Number(link.weight) || 1) * 0.35
    );

</script>

</body>
</html>
