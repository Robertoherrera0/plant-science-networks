
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Alaska_adjacency</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFFFFF;
}

graph {
    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<div id="graph"></div>


<!-- 3D force graph -->
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph"></script>

<script type="module">

import ForceGraph3D
    from "https://cdn.jsdelivr.net/npm/3d-force-graph/+esm";

const graphData = {"nodes": [{"id": "IckertBond, Stefanie M", "name": "IckertBond, Stefanie M", "degree": 1, "strength": 1.0}, {"id": "Spellman, Katie V", "name": "Spellman, Katie V", "degree": 2, "strength": 7.0}, {"id": "Mulder, Christa P H", "name": "Mulder, Christa P H", "degree": 1, "strength": 6.0}], "links": [{"source": "IckertBond, Stefanie M", "target": "Spellman, Katie V", "weight": 1.0}, {"source": "Spellman, Katie V", "target": "Mulder, Christa P H", "weight": 6.0}]};

console.log("First edge:", graphData.links[0]);
console.log("Nodes:", graphData.nodes.length);
console.log("Edges:", graphData.links.length);

const Graph = ForceGraph3D()(
    document.getElementById("graph")
);

Graph
    .nodeId("id")
    .linkSource("source")
    .linkTarget("target")
    .graphData(graphData)
    .backgroundColor("#FFFFFF")
    .showNavInfo(false)

    // Node appearance
    .nodeColor(() => "#073763")
    .nodeVal(node =>
        1.5 + Math.sqrt(node.strength + 1) * 0.45
    )

    // Edge appearance
    .linkColor(() => "#648FC9")
    .linkOpacity(0.7)
    .linkWidth(link =>
        0.5 + Math.sqrt(Number(link.weight) || 1) * 0.35
    );

</script>

</body>
</html>
